plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deneth.cruzelauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deneth.cruzelauncher'
        minSdk 21          // Android 5.0+ – covers almost every Android head unit
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the APK installs directly on the head unit.
            // Replace with your own keystore before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
