name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          # Retry: the Gradle download sometimes times out on GitHub runners
          for i in 1 2 3; do
            ./gradlew --no-daemon --stacktrace assembleRelease && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Build attempt $i failed, retrying in 20s..."; sleep 20
          done
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CruzeLauncher.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: CruzeLauncher-apk
          path: out/CruzeLauncher.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/CruzeLauncher.apk
